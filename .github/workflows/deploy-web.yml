name: Deploy web build to GitHub Pages

on:
  push:
    branches: [claude/puzzlebook-snap-shikaku-7vggwz, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      # SPA fallback so deep links like /Puzzlegame-/play don't 404 on reload
      - run: cp dist/index.html dist/404.html
      # _expo/ starts with an underscore — block Jekyll from dropping it
      - run: touch dist/.nojekyll
      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
